# LibreLane/OpenLane 2 starter configuration for dual-core RISC-V SoC
DESIGN_NAME: soc_top

# Only synthesizable RTL. Testbenches, .bak, .vcd, .wlf, .mpf are excluded.
VERILOG_FILES:
  - dir::src/rv32i_soc_defines.v
  - dir::src/alu.v
  - dir::src/regfile.v
  - dir::src/decoder.v
  - dir::src/rv321i_core.v
  - dir::src/imem.v
  - dir::src/addr_decoder.v
  - dir::src/arbiter.v
  - dir::src/noc_interconnect.v
  - dir::src/shared_dmem.v
  - dir::src/ic_mailbox.v
  - dir::src/uart_peripheral.v
  - dir::src/gpio_peripheral.v
  - dir::src/soc_top.v

VERILOG_INCLUDE_DIRS:
  - dir::src
  

# RTL UART parameter CLKS_PER_BIT=434 is consistent with ~50 MHz / 115200 baud.
CLOCK_PORT: clk
CLOCK_PERIOD: 20.0

PNR_SDC_FILE: dir::constraints/impl.sdc
SIGNOFF_SDC_FILE: dir::constraints/signoff.sdc

# Conservative starting point for a much larger design than SPM/counters.
FP_CORE_UTIL: 30

# Start with the default sky130 PDK/SCL unless your lab specifies another one.
pdk::sky130A:
  FP_CORE_UTIL: 30
  PL_TARGET_DENSITY_PCT: 40
  
  PDN_VPITCH: 15
  PDN_HPITCH: 15

  PDN_VOFFSET: 5
  PDN_HOFFSET: 5

  PDN_VWIDTH: 2
  PDN_HWIDTH: 2
  
  # I/O PIN PLACEMENT
  FP_PIN_ORDER_CFG: dir::pin_order.cfg

  FP_IO_VLAYER: met3
  FP_IO_HLAYER: met2

