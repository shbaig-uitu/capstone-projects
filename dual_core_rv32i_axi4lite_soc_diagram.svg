<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f2f2f"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#6f8a3c"/>
  </marker>
  <style>
    .title { font: 700 31px Arial, Helvetica, sans-serif; fill:#242424; }
    .subtitle { font: 18px Arial, Helvetica, sans-serif; fill:#606060; }
    .h1 { font: 700 20px Arial, Helvetica, sans-serif; fill:#292929; }
    .h2 { font: 700 17px Arial, Helvetica, sans-serif; fill:#292929; }
    .body { font: 15px Arial, Helvetica, sans-serif; fill:#3d3d3d; }
    .small { font: 13px Arial, Helvetica, sans-serif; fill:#5d5d5d; }
    .addr { font: 13px 'Courier New', monospace; fill:#5a5a5a; }
    .box { stroke:#5d5a52; stroke-width:1.6; rx:7; ry:7; }
    .edge { fill:none; stroke:#323232; stroke-width:2.6; marker-end:url(#arrow); }
    .irq { fill:none; stroke:#738845; stroke-width:2.2; stroke-dasharray:9 7; marker-end:url(#arrowGreen); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>

<text x="800" y="54" text-anchor="middle" class="title">Dual Core RV32I AXI4 Lite SoC Architecture</text>
<text x="800" y="84" text-anchor="middle" class="subtitle">Two independent processors sharing memory and peripherals through a structured interconnect</text>
<rect x="665" y="120" width="455" height="665" fill="none" stroke="#89946a" stroke-width="1.7" stroke-dasharray="8 7" rx="8"/>
